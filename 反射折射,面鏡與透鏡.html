<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國二理化｜光的反射與折射、面鏡與透鏡成像 互動卡片</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --teal: #0f766e;
      --teal-soft: #f0fdfa;
      --success: #15803d;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      --error: #b91c1c;
      --error-bg: #fee2e2;
      --error-border: #fca5a5;
      --border: #e2e8f0;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.68;
      padding: 24px 16px 72px;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    .top-nav {
      margin-bottom: 14px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: all 0.15s ease;
    }

    .back-link:hover {
      background: var(--primary-soft);
      border-color: #93c5fd;
      color: var(--primary);
    }

    header {
      background: linear-gradient(135deg, #1e40af, #0284c7 55%, #0d9488);
      color: #fff;
      padding: 24px 26px;
      border-radius: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.48rem;
    }

    header p {
      margin: 0;
      opacity: 0.94;
      font-size: 0.96rem;
    }

    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .mode-btn {
      flex: 1 1 220px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.15s ease;
    }

    .mode-btn:hover {
      border-color: #93c5fd;
      background: var(--primary-soft);
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .mode-btn.teal.active {
      background: var(--teal);
      border-color: var(--teal);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .filter-group, .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    button:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.active.teal-filter {
      background: var(--teal);
      border-color: var(--teal);
    }

    .stats {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .q-num {
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
    }

    .k-num {
      font-weight: 700;
      color: var(--teal);
      font-size: 1rem;
    }

    .badge {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
    }

    .badge.teal {
      background: var(--teal-soft);
      color: var(--teal);
    }

    .question {
      font-size: 1.06rem;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .summary-hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover {
      background: var(--primary-soft);
      border-color: #93c5fd;
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
      font-weight: 600;
    }

    .option-btn.wrong {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error);
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .reveal-btn {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: #bfdbfe;
      font-weight: 600;
    }

    .reveal-btn:hover {
      background: #dbeafe;
    }

    .reveal-btn.teal {
      background: var(--teal-soft);
      color: var(--teal);
      border-color: #99f6e4;
    }

    .reveal-btn.teal:hover {
      background: #ccfbf1;
    }

    .feedback {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .feedback.ok { color: var(--success); }
    .feedback.no { color: var(--error); }

    .drawer {
      display: none;
      margin-top: 14px;
      padding: 16px 18px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 0.94rem;
    }

    .drawer.teal {
      border-left-color: var(--teal);
      background: #f9fefd;
    }

    .drawer.open {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .drawer .ans-line {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .drawer ul {
      margin: 8px 0 14px;
      padding-left: 20px;
    }

    .drawer li {
      margin-bottom: 6px;
    }

    .callout {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #78350f;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    .chart-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }

    .chart-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      text-align: center;
    }

    .chart-box svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <a class="back-link" href="./index.html">← 回到學習單元目錄</a>
    </nav>

    <header>
      <h1>國二理化｜光的反射與折射、面鏡與透鏡成像</h1>
    </header>

    <div class="mode-switch">
      <button class="mode-btn teal active" id="tabKnowledge">📚 知識點卡片（6 張）</button>
      <button class="mode-btn" id="tabQuiz">✏️ 互動練習題（15 題）</button>
    </div>

    <!-- 知識點專區 -->
    <section id="knowledgeSection">
      <div class="toolbar">
        <div class="filter-group" id="kFilters">
          <button class="active teal-filter" data-kfilter="all">全部知識點（6）</button>
          <button data-kfilter="reflection">反射與面鏡</button>
          <button data-kfilter="refraction">光的折射與色散</button>
          <button data-kfilter="lens">透鏡成像與眼睛</button>
        </div>
        <div class="action-group">
          <button id="toggleAllKnowledgeBtn">全部展開圖文</button>
          <button id="collapseAllKnowledgeBtn">全部收合</button>
        </div>
      </div>
      <div class="card-list" id="knowledgeList"></div>
    </section>

    <!-- 練習題專區 -->
    <section id="quizSection" class="hidden">
      <div class="toolbar">
        <div class="filter-group" id="qFilters">
          <button class="active" data-qfilter="all">全部（15）</button>
          <button data-qfilter="reflection">反射與面鏡（5）</button>
          <button data-qfilter="refraction">折射與色散（4）</button>
          <button data-qfilter="lens">透鏡成像與眼睛（6）</button>

        <div class="action-group">
          <span class="stats" id="statsText">已作答：0 / 15｜答對：0</span>
          <button id="toggleAllQuizBtn">全部展開詳解</button>
          <button id="resetQuizBtn">重新作答</button>
        </div>
      </div>
      <div class="card-list" id="quizList"></div>
    </section>
  </div>

          "(C) 剛好等於一倍焦距",
          "(D) 小於一倍焦距"
        ],
        answer: "D",
        explanation: "凸透鏡當放大鏡使用時，物體必須放在「一倍焦距以內（物距 ＜ f）」，才能在同側看到正立放大的虛像。"
      },
      {
        id: 13,
        category: "lens",
        tag: "凹透鏡成像",
        q: "小美透過一個透鏡觀察前方的鉛筆，無論透鏡離鉛筆遠或近，看到的鉛筆永遠都是「正立且縮小」的。請問小美拿的是哪一種透鏡？",
        options: [
          "(A) 凸透鏡",
          "(B) 凹透鏡",
          "(C) 平面鏡",
          "(D) 凹面鏡"
        ],
        answer: "B",
        explanation: "只有「凹透鏡」在任何距離下，成像永遠是「正立縮小虛像」。"
      },
      {
        id: 14,
        category: "lens",
        tag: "透鏡遮住一半",
        q: "做凸透鏡成像實驗時，若用紙板把凸透鏡的「下半部」完全遮住，紙屏上的燭火成像會發生什麼變化？",
        options: [
          "(A) 燭火的像只剩下一半（上半部或下半部消失）",
          "(B) 燭火的像完全消失",
          "(C) 燭火的像依然完整，但亮度變暗",
          "(D) 燭火的像由倒立變成正立"
        ],
        answer: "C",
        explanation: "物體每一點發出的光線都會射向整片透鏡，遮住一半透鏡只是讓通過的光線總量減少一半，因此成像依然完整，只是亮度變暗。"
      },
      {
        id: 15,
        category: "lens",
        tag: "近視與遠視矯正",
        q: "阿哲看遠處黑板上的字時覺得模糊不清，眼科醫生檢查後發現光線進入他眼睛後，成像落在「視網膜前方」。阿哲患有什麼視力問題？應該配戴哪種鏡片矯正？",
        options: [
          "(A) 近視眼，配戴凹透鏡",
          "(B) 近視眼，配戴凸透鏡",
          "(C) 遠視眼，配戴凹透鏡",
          "(D) 遠視眼，配戴凸透鏡"
        ],
        answer: "A",
        explanation: "成像落在視網膜前方是「近視眼」，需要配戴「凹透鏡」先將光線稍微發散，使成像往後推回視網膜上。"
      }
    ];

    const state = {
      mode: "knowledge",
      kFilter: "all",
      openK: { K1: true },
      qFilter: "all",
      selectedQ: {},
      openQ: {}
    };

    const tabKnowledge = document.getElementById("tabKnowledge");
    const tabQuiz = document.getElementById("tabQuiz");
    const knowledgeSection = document.getElementById("knowledgeSection");
    const quizSection = document.getElementById("quizSection");

    const knowledgeListEl = document.getElementById("knowledgeList");
    const quizListEl = document.getElementById("quizList");
    const statsTextEl = document.getElementById("statsText");

    function switchMode(mode) {
      state.mode = mode;
      if (mode === "knowledge") {
        tabKnowledge.classList.add("active");
        tabQuiz.classList.remove("active");
        knowledgeSection.classList.remove("hidden");
        quizSection.classList.add("hidden");
        renderKnowledge();
      } else {
        tabQuiz.classList.add("active");
        tabKnowledge.classList.remove("active");
        quizSection.classList.remove("hidden");
        knowledgeSection.classList.add("hidden");
        renderQuiz();
      }
    }

    function renderKnowledge() {
      const visible = knowledgeCards.filter(k => state.kFilter === "all" || k.category === state.kFilter);
      knowledgeListEl.innerHTML = visible.map(k => {
        const isOpen = !!state.openK[k.id];
        return `
          <article class="card">
            <div class="card-top">
              <span class="k-num">${k.id} 知識點</span>
              <span class="badge teal">${k.tag}</span>
            </div>
            <h2 class="question">${k.title}</h2>
            <p class="summary-hint">${k.hint}</p>
            <div class="card-actions">
              <button class="reveal-btn teal" data-ktoggle="${k.id}">
                ${isOpen ? "收合重點與圖表" : "點開看重點與圖表"}
              </button>
            </div>
            <div class="drawer teal ${isOpen ? "open" : ""}">
              <ul>${k.points.map(pt => `<li>${pt}</li>`).join("")}</ul>
              <div class="callout">${k.callout}</div>
              <div class="chart-box">
                <div class="chart-title">${k.chartTitle}</div>
                ${k.svg}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function updateQuizStats() {
      const answeredIds = Object.keys(state.selectedQ);
      const correctCount = answeredIds.filter(
        id => state.selectedQ[id] === questions.find(q => q.id === Number(id)).answer
      ).length;
      statsTextEl.textContent = `已作答：${answeredIds.length} / ${questions.length}｜答對：${correctCount}`;
    }

    function renderQuiz() {
      const visible = questions.filter(q => state.qFilter === "all" || q.category === state.qFilter);
      quizListEl.innerHTML = visible.map(q => {
        const picked = state.selectedQ[q.id];
        const isOpen = !!state.openQ[q.id];

        let feedbackHtml = "";
        if (picked) {
          if (picked === q.answer) {
            feedbackHtml = `<span class="feedback ok">答對了！觀念超穩 🎉</span>`;
          } else {
            feedbackHtml = `<span class="feedback no">再想想看，正確答案是 (${q.answer})</span>`;
          }
        }

        const optionsHtml = q.options.map(opt => {
          const letter = opt.trim().charAt(1);
          let cls = "option-btn";
          if (picked) {
            if (letter === q.answer) cls += " correct";
            else if (letter === picked) cls += " wrong";
          }
          return `<button class="${cls}" data-qid="${q.id}" data-choice="${letter}">${opt}</button>`;
        }).join("");

        return `
          <article class="card">
            <div class="card-top">
              <span class="q-num">第 ${q.id} 題</span>
              <span class="badge">${q.tag}</span>
            </div>
            <p class="question">${q.q}</p>
            <div class="options">${optionsHtml}</div>
            <div class="card-actions">
              <div>${feedbackHtml}</div>
              <button class="reveal-btn" data-qtoggle="${q.id}">
                ${isOpen ? "隱藏答案與詳解" : "看答案與詳解"}
              </button>
            </div>
            <div class="drawer ${isOpen ? "open" : ""}">
              <div class="ans-line">正確答案：(${q.answer})</div>
              <div><strong>詳解：</strong>${q.explanation}</div>
            </div>
          </article>
        `;
      }).join("");

      updateQuizStats();
    }

    tabKnowledge.addEventListener("click", () => switchMode("knowledge"));
    tabQuiz.addEventListener("click", () => switchMode("quiz"));

    knowledgeListEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-ktoggle]");
      if (!btn) return;
      const kid = btn.dataset.ktoggle;
      state.openK[kid] = !state.openK[kid];
      renderKnowledge();
    });

    document.querySelectorAll("[data-kfilter]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-kfilter]").forEach(b => b.classList.remove("active", "teal-filter"));
        btn.classList.add("active", "teal-filter");
        state.kFilter = btn.dataset.kfilter;
        renderKnowledge();
      });
    });

    document.getElementById("toggleAllKnowledgeBtn").addEventListener("click", () => {
      knowledgeCards.forEach(k => { state.openK[k.id] = true; });
      renderKnowledge();
    });

    document.getElementById("collapseAllKnowledgeBtn").addEventListener("click", () => {
      state.openK = {};
      renderKnowledge();
    });

    quizListEl.addEventListener("click", (e) => {
      const optBtn = e.target.closest(".option-btn");
      if (optBtn) {
        const qid = Number(optBtn.dataset.qid);
        state.selectedQ[qid] = optBtn.dataset.choice;
        state.openQ[qid] = true;
        renderQuiz();
        return;
      }

      const revBtn = e.target.closest("[data-qtoggle]");
      if (revBtn) {
        const qid = Number(revBtn.dataset.qtoggle);
        state.openQ[qid] = !state.openQ[qid];
        renderQuiz();
      }
    });

    document.querySelectorAll("[data-qfilter]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-qfilter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.qFilter = btn.dataset.qfilter;
        renderQuiz();
      });
    });

    document.getElementById("toggleAllQuizBtn").addEventListener("click", () => {
      const anyClosed = questions.some(q => !state.openQ[q.id]);
      questions.forEach(q => { state.openQ[q.id] = anyClosed; });
      document.getElementById("toggleAllQuizBtn").textContent = anyClosed ? "全部收合詳解" : "全部展開詳解";
      renderQuiz();
    });

    document.getElementById("resetQuizBtn").addEventListener("click", () => {
      state.selectedQ = {};
      state.openQ = {};
      document.getElementById("toggleAllQuizBtn").textContent = "全部展開詳解";
      renderQuiz();
    });

    renderKnowledge();
  </script>
</body>
</html>
