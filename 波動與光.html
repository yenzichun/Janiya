<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國二理化｜波動與光 </title>
  <style>
        :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --teal: #0f766e;
      --teal-soft: #f0fdfa;
      --success: #15803d;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      --error: #b91c1c;
      --error-bg: #fee2e2;
      --error-border: #fca5a5;
      --border: #e2e8f0;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.68;
      padding: 24px 16px 72px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      background: linear-gradient(135deg, #1d4ed8, #0284c7 60%, #0d9488);
      color: #fff;
      padding: 24px 26px;
      border-radius: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.52rem;
    }

    header p {
      margin: 0;
      opacity: 0.94;
      font-size: 0.96rem;
    }

    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .mode-btn {
      flex: 1 1 200px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.15s ease;
    }

    .mode-btn:hover {
      border-color: #93c5fd;
      background: var(--primary-soft);
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .mode-btn.teal.active {
      background: var(--teal);
      border-color: var(--teal);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .filter-group, .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    button:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.active.teal-filter {
      background: var(--teal);
      border-color: var(--teal);
    }

    .stats {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .q-num {
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
    }

    .k-num {
      font-weight: 700;
      color: var(--teal);
      font-size: 1rem;
    }

    .badge {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
    }

    .badge.teal {
      background: var(--teal-soft);
      color: var(--teal);
    }

    .question {
      font-size: 1.06rem;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .summary-hint {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover {
      background: var(--primary-soft);
      border-color: #93c5fd;
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
      font-weight: 600;
    }

    .option-btn.wrong {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error);
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .reveal-btn {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: #bfdbfe;
      font-weight: 600;
    }

    .reveal-btn:hover {
      background: #dbeafe;
    }

    .reveal-btn.teal {
      background: var(--teal-soft);
      color: var(--teal);
      border-color: #99f6e4;
    }

    .reveal-btn.teal:hover {
      background: #ccfbf1;
    }

    .feedback {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .feedback.ok { color: var(--success); }
    .feedback.no { color: var(--error); }

    .drawer {
      display: none;
      margin-top: 14px;
      padding: 16px 18px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 0.94rem;
    }

    .drawer.teal {
      border-left-color: var(--teal);
      background: #f9fefd;
    }

    .drawer.open {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .drawer .ans-line {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .drawer ul {
      margin: 8px 0 14px;
      padding-left: 20px;
    }

    .drawer li {
      margin-bottom: 6px;
    }

    .callout {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #78350f;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    .chart-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }

    .chart-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      text-align: center;
    }
    .chart-box svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .hidden {
      display: none !important;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>國二理化｜波動與光</h1>
    </header>

    <div class="mode-switch">
      <button class="mode-btn teal active" id="tabKnowledge">知識點</button>
      <button class="mode-btn" id="tabQuiz">練習</button>
    </div>

    <!-- 知識點專區 -->
    <section id="knowledgeSection">
      <div class="toolbar">
        <div class="filter-group" id="kFilters">
          <button class="active teal-filter" data-kfilter="all">全部知識點（6）</button>
          <button data-kfilter="wave-basic">波動基礎與波速</button>
          <button data-kfilter="wave-ext">半徑、反射與透射</button>
          <button data-kfilter="light">光學現象</button>
        </div>
        <div class="action-group">
          <button id="toggleAllKnowledgeBtn">全部展開圖文</button>
          <button id="collapseAllKnowledgeBtn">全部收合</button>
        </div>
      </div>
      <div class="card-list" id="knowledgeList"></div>
    </section>

    <!-- 練習題專區 -->
    <section id="quizSection" class="hidden">
      <div class="toolbar">
        <div class="filter-group" id="qFilters">
          <button class="active" data-qfilter="all">全部（12）</button>
          <button data-qfilter="wave">波動基礎與波速</button>
          <button data-qfilter="light">光學現象</button>
          <button data-qfilter="advanced">半徑、反射與透射</button>
        </div>
        <div class="action-group">
          <span class="stats" id="statsText">已作答：0 / 12｜答對：0</span>
          <button id="toggleAllQuizBtn">全部展開詳解</button>
          <button id="resetQuizBtn">重新作答</button>
        </div>
      </div>
      <div class="card-list" id="quizList"></div>
    </section>
  </div>

  <script>
    const knowledgeCards = [
      {
        id: "K1",
        category: "wave-basic",
        tag: "波動定義與分類",
        title: "什麼是波動？橫波、縱波、力學波與電磁波",
        hint: "核心一句話：波傳遞的是「能量」，介質只在原地振動，不會跟著跑。",
        points: [
          "<strong>介質與能量</strong>：振動在介質中傳遞的現象。傳遞的是<strong>能量</strong>，介質只在原地附近振動（水波介質是水、繩波是繩子、聲波主要是空氣）。",
          "<strong>橫波（高低波）</strong>：介質振動方向與波前進方向<strong>垂直</strong>（例：甩繩波、水波、光波）。",
          "<strong>縱波（疏密波）</strong>：介質振動方向與波前進方向<strong>平行</strong>，有疏部與密部（例：彈簧伸縮波、空氣中的聲波）。",
          "<strong>力學波 vs. 電磁波</strong>：力學波<strong>需要介質</strong>（繩波、水波、聲波）；電磁波<strong>不需要介質</strong>，可在真空傳播（光波、無線電波）。"
        ],
        callout: "考試陷阱：外太空是真空，所以沒有聲音，但看得到星星發出的光！",
        chartTitle: "橫波波形名詞（波峰、波谷、振幅 A、波長 λ）與縱波疏密示意",
        svg: `

            <text x="18" y="22" font-size="13" font-weight="bold" fill="#0f766e">1. 橫波（振動 ⊥ 前進方向）</text>

            <path d="M 30 85 Q 72 25, 115 85 T 200 85 T 285 85 T 355 70" fill="none" stroke="#2563eb" stroke-width="3"/>
            <!-- 波峰與波谷 -->
            <circle cx="72" cy="55" r="4" fill="#ef4444"/>

            <text x="135" y="31" font-size="11" fill="#0f766e" font-weight="bold">波長 λ（峰到峰）</text>

            <!-- 分隔線 -->
            <line x1="385" y1="15" x2="385" y2="195" stroke="#e2e8f0" stroke-width="2"/>

            <!-- 縱波區 -->
            <text x="405" y="22" font-size="13" font-weight="bold" fill="#0f766e">2. 縱波（振動 ∥ 前進方向，疏密波）</text>
            <line x1="405" y1="85" x2="740" y2="85" stroke="#cbd5e1" stroke-width="2"/>
            <!-- 密部與疏部圓點 -->
            <g fill="#2563eb">
              <circle cx="420" cy="85" r="4"/><circle cx="427" cy="85" r="4"/><circle cx="434" cy="85" r="4"/><circle cx="441" cy="85" r="4"/>

              <circle cx="626" cy="85" r="4"/><circle cx="633" cy="85" r="4"/><circle cx="640" cy="85" r="4"/><circle cx="647" cy="85" r="4"/>
            </g>
            <text x="415" y="114" font-size="11" fill="#1d4ed8" font-weight="bold">密部</text>
            <text x="470" y="114" font-size="11" fill="#64748b" font-weight="bold">疏部</text>
            <text x="518" y="114" font-size="11" fill="#1d4ed8" font-weight="bold">密部</text>
            <text x="573" y="114" font-size="11" fill="#64748b" font-weight="bold">疏部</text>
            <text x="621" y="114" font-size="11" fill="#1d4ed8" font-weight="bold">密部</text>
            <!-- 前進方向箭頭 -->
            <line x1="420" y1="155" x2="710" y2="155" stroke="#0f766e" stroke-width="2.5"/>

            <text x="515" y="175" font-size="12" fill="#0f766e" font-weight="bold">波前進方向 →</text>
          </svg>

      {
        id: "K2",
        category: "wave-basic",
        tag: "週期、頻率與波速",
        title: "週期、頻率與波速公式（v = f × λ）",
        hint: "同一種介質波速固定；頻率變大時，波長會變小。",
        points: [
          "<strong>週期（T）</strong>：振動一次所需的時間，單位為秒（s）。",
          "<strong>頻率（f）</strong>：每秒振動次數，單位為赫茲（Hz）。與週期互為倒數：<strong>f = 1 / T</strong>、<strong>T = 1 / f</strong>。",
          "<strong>波速公式</strong>：波走一個波長（λ）花一個週期（T），所以 <strong>v = λ / T = f × λ</strong>。",
          "<strong>波速決定於介質</strong>：同一條均勻繩子或同一溫度下的空氣，波速（v）固定不變；若頻率 f 變大，波長 λ 成反比變小。"
        ],
        callout: "提醒：手上下甩繩的快慢決定「頻率 f」，繩子本身的材質與鬆緊決定「波速 v」，兩者不要搞混！",
        chartTitle: "同一介質下，頻率 f 變大（週期變小）時，波長 λ 變短的對比",
        svg: `
          <svg viewBox="0 0 760 190" xmlns="http://www.w3.org/2000/svg">

            <text x="85" y="113" font-size="11" fill="#dc2626" font-weight="bold">較短波長 λ₂</text>
          </svg>
        `

      {

        hint: "往外擴散範圍變大，總能量被分攤開來，強度與振幅都會減弱。",

          "<strong>振幅（A）與半徑</strong>：振幅代表振動幅度與能量大小，隨半徑 r 變大、能量分散，<strong>振幅也會隨半徑增加而變小</strong>。"
        ],
        callout: "口訣：半徑 r 變大 → 範圍變大、能量被攤平 → 強度減弱、振幅變小。",
        chartTitle: "點光源／波源向外擴散：半徑 r 變大，單位面積能量分散",
        svg: `
          <svg viewBox="0 0 760 195" xmlns="http://www.w3.org/2000/svg">

            <circle cx="130" cy="100" r="24" fill="none" stroke="#2563eb" stroke-width="2.5"/>

            <line x1="300" y1="165" x2="300" y2="45" stroke="#334155" stroke-width="2"/>
            <line x1="300" y1="165" x2="700" y2="165" stroke="#334155" stroke-width="2"/>
            <text x="260" y="55" font-size="11" fill="#334155" font-weight="bold">強度 / 振幅</text>

            <path d="M 320 62 Q 410 115, 675 152" fill="none" stroke="#2563eb" stroke-width="3"/>

          </svg>
        `
      },
      {
        id: "K4",
        category: "wave-ext",
        tag: "波的反射與透射",
        title: "波遇到交界處：反射波與透射波的變化",
        hint: "透射波進新介質：頻率不變，波速與波長變；反射波回原介質：頻率、波速、波長不變。",

            </div>
            <p class="question">${q.q}</p>
            <div class="options">${optionsHtml}</div>
            <div class="card-actions">
              <div>${feedbackHtml}</div>
              <button class="reveal-btn" data-qtoggle="${q.id}">
                ${isOpen ? "隱藏答案與詳解" : "看答案與詳解"}
              </button>
            </div>
            <div class="drawer ${isOpen ? "open" : ""}">
              <div class="ans-line">正確答案：(${q.answer})</div>
              <div><strong>詳解：</strong>${q.explanation}</div>
            </div>
          </article>
        `;
      }).join("");

      updateQuizStats();
    }

    tabKnowledge.addEventListener("click", () => switchMode("knowledge"));
    tabQuiz.addEventListener("click", () => switchMode("quiz"));

    knowledgeListEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-ktoggle]");
      if (!btn) return;
      const kid = btn.dataset.ktoggle;
      state.openK[kid] = !state.openK[kid];
      renderKnowledge();
    });

    document.querySelectorAll("[data-kfilter]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-kfilter]").forEach(b => b.classList.remove("active", "teal-filter"));
        btn.classList.add("active", "teal-filter");
        state.kFilter = btn.dataset.kfilter;
        renderKnowledge();
      });
    });

    document.getElementById("toggleAllKnowledgeBtn").addEventListener("click", () => {
      knowledgeCards.forEach(k => { state.openK[k.id] = true; });
      renderKnowledge();
    });

    document.getElementById("collapseAllKnowledgeBtn").addEventListener("click", () => {
      state.openK = {};
      renderKnowledge();
    });

    quizListEl.addEventListener("click", (e) => {
      const optBtn = e.target.closest(".option-btn");
      if (optBtn) {
        const qid = Number(optBtn.dataset.qid);
        state.selectedQ[qid] = optBtn.dataset.choice;
        state.openQ[qid] = true;
        renderQuiz();
        return;
      }

      const revBtn = e.target.closest("[data-qtoggle]");
      if (revBtn) {
        const qid = Number(revBtn.dataset.qtoggle);
        state.openQ[qid] = !state.openQ[qid];
        renderQuiz();
      }
    });

    document.querySelectorAll("[data-qfilter]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-qfilter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.qFilter = btn.dataset.qfilter;
        renderQuiz();
      });
    });

    document.getElementById("toggleAllQuizBtn").addEventListener("click", () => {
      const anyClosed = questions.some(q => !state.openQ[q.id]);
      questions.forEach(q => { state.openQ[q.id] = anyClosed; });
      document.getElementById("toggleAllQuizBtn").textContent = anyClosed ? "全部收合詳解" : "全部展開詳解";
      renderQuiz();
    });

    document.getElementById("resetQuizBtn").addEventListener("click", () => {
      state.selectedQ = {};
      state.openQ = {};
      document.getElementById("toggleAllQuizBtn").textContent = "全部展開詳解";
      renderQuiz();
    });

    renderKnowledge();
  </script>
</body>
</html>
